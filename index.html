<script>

/* =========================================================
   CONFIGURAZIONE
   ========================================================= */

const PROXY = "https://little-resonance-5ec5.my5vp6787f.workers.dev/";

let requests = 0;
let errors = 0;
let testedEndpoints = [];
let responses = [];


/* =========================================================
   STATO
   ========================================================= */

function setStatus(text, type) {

    const element = document.getElementById("status");

    element.textContent = text;
    element.className = "status " + type;
}


/* =========================================================
   URL
   ========================================================= */

function normalizeBaseUrl(value) {

    let url = value.trim();

    if (!url) return "";

    url = url.replace(/\/+$/, "");

    return url;
}


function validUrl(value) {

    try {
        new URL(value);
        return true;
    } catch {
        return false;
    }
}


/* =========================================================
   CHIAMATA
   ========================================================= */

async function requestApi(url, apiKey) {

    requests++;

    document.getElementById("requestsNumber").textContent = requests;

    const proxyUrl =
        PROXY +
        "?url=" +
        encodeURIComponent(url) +
        "&key=" +
        encodeURIComponent(apiKey);

    try {

        const response = await fetch(proxyUrl, {
            method: "GET"
        });

        const text = await response.text();

        let data = null;

        try {
            data = JSON.parse(text);
        } catch {
            data = text;
        }

        const result = {
            url: url,
            status: response.status,
            ok: response.ok,
            data: data,
            raw: text
        };

        responses.push(result);

        if (!response.ok) {
            errors++;
        }

        document.getElementById("errorNumber").textContent = errors;

        return result;

    } catch (error) {

        errors++;

        document.getElementById("errorNumber").textContent = errors;

        const result = {
            url: url,
            status: 0,
            ok: false,
            data: null,
            raw: "",
            error: error.message
        };

        responses.push(result);

        return result;
    }
}


/* =========================================================
   ANALISI STRUTTURA JSON
   ========================================================= */

function isObject(value) {

    return value !== null &&
           typeof value === "object" &&
           !Array.isArray(value);
}


function walk(value, callback, path = []) {

    callback(value, path);

    if (Array.isArray(value)) {

        value.forEach((item, index) => {
            walk(item, callback, path.concat(index));
        });

        return;
    }

    if (!isObject(value)) return;

    Object.keys(value).forEach(key => {

        walk(
            value[key],
            callback,
            path.concat(key)
        );

    });
}


function allKeys(data) {

    const result = [];

    walk(data, (value, path) => {

        if (!path.length) return;

        const last = path[path.length - 1];

        if (typeof last === "string") {
            result.push({
                key: last,
                path: path.join("."),
                value: value
            });
        }
    });

    return result;
}


function normalizeKey(value) {

    return String(value)
        .toLowerCase()
        .replace(/[^a-z0-9]/g, "");
}


function findAliases(data, aliases) {

    const wanted = aliases.map(normalizeKey);

    const found = [];

    allKeys(data).forEach(item => {

        if (
            wanted.includes(
                normalizeKey(item.key)
            )
        ) {

            if (
                item.value !== null &&
                item.value !== undefined &&
                item.value !== ""
            ) {

                found.push(item);
            }
        }
    });

    return found;
}


function firstAlias(data, aliases) {

    const result = findAliases(data, aliases);

    return result.length ? result[0] : null;
}


/* =========================================================
   RICONOSCIMENTO RECORD
   ========================================================= */

function objectLooksLikeMatch(obj) {

    if (!isObject(obj)) return false;

    const keys =
        Object.keys(obj).map(normalizeKey);

    const id =
        keys.includes("id") ||
        keys.includes("matchid") ||
        keys.includes("fixtureid") ||
        keys.includes("gameid");

    const date =
        keys.includes("date") ||
        keys.includes("datetime") ||
        keys.includes("kickoff") ||
        keys.includes("starttime") ||
        keys.includes("fixturedate");

    const teams =
        keys.includes("teams") ||
        keys.includes("hometeam") ||
        keys.includes("awayteam") ||
        keys.includes("home") ||
        keys.includes("away");

    const league =
        keys.includes("league") ||
        keys.includes("competition") ||
        keys.includes("tournament");

    return (
        (id && date) ||
        (date && teams) ||
        (teams && league)
    );
}


function findMatchRecords(data) {

    const matches = [];

    walk(data, value => {

        if (
            isObject(value) &&
            objectLooksLikeMatch(value)
        ) {

            if (!matches.includes(value)) {
                matches.push(value);
            }
        }

    });

    return matches;
}


/* =========================================================
   DATA MATCH
   ========================================================= */

function findDate(obj) {

    const result = firstAlias(obj, [
        "date",
        "datetime",
        "kickoff",
        "start_time",
        "startTime",
        "fixture_date",
        "fixtureDate"
    ]);

    return result ? result.value : null;
}


function findId(obj) {

    const result = firstAlias(obj, [
        "id",
        "match_id",
        "matchId",
        "fixture_id",
        "fixtureId",
        "game_id",
        "gameId"
    ]);

    return result ? result.value : null;
}


function findHome(obj) {

    const result = firstAlias(obj, [
        "homeTeam",
        "home_team",
        "hometeam",
        "home"
    ]);

    return result ? result.value : null;
}


function findAway(obj) {

    const result = firstAlias(obj, [
        "awayTeam",
        "away_team",
        "awayteam",
        "away"
    ]);

    return result ? result.value : null;
}


function valueText(value) {

    if (value === null || value === undefined) {
        return "";
    }

    if (typeof value === "object") {

        if (value.name) return String(value.name);
        if (value.shortName) return String(value.shortName);
        if (value.title) return String(value.title);

        if (value.id !== undefined) {
            return "ID " + value.id;
        }

        return JSON.stringify(value);
    }

    return String(value);
}


/* =========================================================
   FILTRO PARTITE FUTURE
   ========================================================= */

function futureMatches(matches) {

    const now = new Date();

    const end = new Date(now);

    end.setDate(end.getDate() + 7);

    return matches.filter(match => {

        const rawDate = findDate(match);

        if (!rawDate) return false;

        const date = new Date(rawDate);

        if (isNaN(date.getTime())) return false;

        return date >= now && date <= end;

    });
}


/* =========================================================
   ENDPOINT DISCOVERY
   ========================================================= */

function buildDiscoveryUrls(baseUrl) {

    const urls = [];

    function add(path) {

        const finalUrl =
            baseUrl + path;

        if (!urls.includes(finalUrl)) {
            urls.push(finalUrl);
        }
    }

    /*
       Primo livello:
       prova la base stessa.
    */

    add("");

    /*
       Endpoint generici comuni.
       NON vengono considerati obbligatori:
       servono solamente come tentativi.
    */

    add("/api");
    add("/v1");
    add("/v1/api");

    add("/matches");
    add("/games");
    add("/fixtures");
    add("/events");

    add("/football");
    add("/soccer");

    add("/leagues");
    add("/competitions");
    add("/teams");
    add("/players");

    return urls;
}

/* =========================================================
   COSTRUZIONE REPORT
   ========================================================= */

function htmlEscape(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function categoryResult(data, category) {

    const found =
        findAliases(data, category.aliases);

    if (found.length) {

        return {
            state: "green",
            label: "TROVATO",
            detail:
                "Campo rilevato: " +
                found[0].path
        };
    }

    return {
        state: "gray",
        label: "NON RILEVATO",
        detail:
            "Non trovato nelle risposte ricevute."
    };
}


function renderDataCategories(data) {

    let html = "";

    DATA_CATEGORIES.forEach(category => {

        const result =
            categoryResult(data, category);

        if (result.state === "green") {
            document.__foundData++;
        }

        html += `
            <div class="result">

                <div class="resultTop">

                    <div class="resultName">
                        ${htmlEscape(category.name)}
                    </div>

                    <div class="badge ${result.state}">
                        ${result.label}
                    </div>

                </div>

                <div class="detail">
                    ${htmlEscape(result.detail)}
                </div>

            </div>
        `;
    });

    return html;
}


/* =========================================================
   PARTITE
   ========================================================= */

function renderMatches(matches) {

    if (!matches.length) {

        return `
            <div class="result">

                <div class="resultTop">

                    <div class="resultName">
                        Partite nei prossimi 7 giorni
                    </div>

                    <div class="badge gray">

                <div class="detail">
                    Nessun record con una data interpretabile
                    compresa nei prossimi 7 giorni è stato trovato
                    nelle risposte analizzate.
                </div>

            </div>
        `;
    }

    let html = `
        <div class="result">

            <div class="resultTop">

                <div class="resultName">
                    Partite nei prossimi 7 giorni
                </div>

                <div class="badge green">
                    ${matches.length} TROVATE
                </div>

            </div>

            <div class="detail">
                Sono state individuate automaticamente
                partite future nelle risposte dell'API.
            </div>

        </div>
    `;

    matches.slice(0, 10).forEach(match => {

        const id = findId(match);
        const date = findDate(match);
        const home = findHome(match);
        const away = findAway(match);

        html += `
            <div class="matchCard">

                <div class="matchTeams">
                    ${htmlEscape(
                        valueText(home) || "Casa non rilevata"
                    )}
                    —
                    ${htmlEscape(

                    )}
                </div>

                        valueText(id) || "non rilevato"
                    )}
                    <br>
                    Data/Ora: ${htmlEscape(
                        valueText(date) || "non rilevata"
                    )}
                </div>

            </div>
        `;
    });

    return html;
}


/* =========================================================

function renderEndpoints() {

    let html = "";

    testedEndpoints.forEach(item => {

        let badgeClass = "gray";
        let label = "NESSUN DATO";

        if (item.ok && item.matches > 0) {
            badgeClass = "green";
            label = "DATI TROVATI";
        }
        else if (item.ok) {
            badgeClass = "yellow";
            label = "RISPOSTA OK";
        }
        else {
            badgeClass = "red";
            label = "ERRORE";
        }

        html += `
            <div class="result">

                <div class="resultTop">

                    <div class="resultName">
                        ${htmlEscape(item.name)}
                    </div>

                    <div class="badge ${badgeClass}">
                        ${label}
                    </div>

                </div>

                <div class="detail">

                    <span class="endpoint">
                        ${htmlEscape(item.url)}
                    </span>

                    <br>

                    HTTP:
                    ${htmlEscape(String(item.status))}

                    <br>

                    Record partita rilevati:
                    ${item.matches}

                </div>

            </div>
        `;
    });

    return html;
}


/* =========================================================

   ========================================================= */

function renderRaw(data) {

    let text = "";

    try {

        text = JSON.stringify(
            data,
            null,
            2
        );

    } catch {

        text = String(data);
    }

    if (text.length > 30000) {
        text = text.slice(0, 30000) +
               "\n\n...[risposta tagliata nel report]";
    }

    return `
        <pre>${htmlEscape(text)}</pre>
    `;
}


/* =========================================================
   ANALISI
   ========================================================= */

async function startAnalysis() {

    const urlInput =
        document.getElementById("apiUrl").value;

    const apiKey =
        document.getElementById("apiKey").value.trim();

    if (!urlInput.trim()) {

        setStatus(
            "Inserisci il Link API.",
            "error"
        );

        return;
    }

    if (!apiKey) {

        setStatus(
            "Inserisci la API Key.",
            "error"
        );

        return;
    }

    const baseUrl =
        normalizeBaseUrl(urlInput);

    if (!validUrl(baseUrl)) {

        setStatus(
            "Il Link API non è valido.",
            "error"
        );

        return;
    }

    requests = 0;
    errors = 0;
    testedEndpoints = [];
    responses = [];

    document.__foundData = 0;

    document.getElementById("requestsNumber").textContent = "0";
    document.getElementById("endpointNumber").textContent = "0";
    document.getElementById("foundNumber").textContent = "0";
    document.getElementById("errorNumber").textContent = "0";

    document.getElementById("report").style.display = "none";

    const button =
        document.getElementById("analyzeButton");

    button.disabled = true;

    setStatus(
        "Connessione all'API in corso...",
        "loading"
    );

    const candidates =
        buildDiscoveryUrls(baseUrl);

    let bestResponse = null;
    let bestMatches = [];
    let successfulResponses = 0;

    /*
       Il tester non presume che un endpoint esista.

       Prova gli indirizzi candidati uno alla volta.
       Se trova una risposta utile continua comunque
       a raccogliere informazioni, ma evita richieste
       infinite.
    */

    for (const url of candidates) {

        if (requests >= 12) {
            break;
        }

        const result =
            await requestApi(url, apiKey);

        const matches =
            result.ok
                ? findMatchRecords(result.data)
                : [];

        testedEndpoints.push({
            name: url === baseUrl
                ? "Endpoint principale"
                : "Endpoint automatico",

            url: url,

            status: result.status,

            ok: result.ok,

            matches: matches.length
        });

        if (result.ok) {
            successfulResponses++;
        }

        if (
            !bestResponse ||
            matches.length > bestMatches.length
        ) {

            bestResponse = result.data;
            bestMatches = matches;
        }

        /*
           Se abbiamo già trovato una risposta
           con partite reali, non continuiamo a
           consumare richieste inutilmente.
        */

        if (matches.length > 0) {
            break;
        }
    }

    button.disabled = false;

    document.getElementById("endpointNumber").textContent =
        testedEndpoints.length;

    document.getElementById("foundNumber").textContent =
        document.__foundData;

    /*
       Nessuna risposta valida.
    */

    if (!bestResponse) {

        document.getElementById("report").style.display = "block";

        document.getElementById("reportContent").innerHTML = `

            <div class="section">

                <div class="sectionTitle">
                    Risultato
                </div>

                <div class="result">

                    <div class="resultTop">

                        <div class="resultName">
                            API non interrogabile
                        </div>

                        <div class="badge red">
                            ERRORE
                        </div>

                    </div>

                    <div class="detail">
                        Nessuno degli endpoint provati ha restituito
                        una risposta HTTP utilizzabile.
                        Controlla Link API, API Key oppure autenticazione.
                    </div>

                </div>

            </div>

            <div class="section">

                <div class="sectionTitle">
                    Endpoint provati
                </div>

                ${renderEndpoints()}

            </div>
        `;

        setStatus(
            "L'API non ha restituito una risposta utilizzabile.",
            "error"
        );

        return;
    }

    /*
       Ora abbiamo una risposta.
       Analizziamo tutti i dati che contiene.
    */

    let combinedData = bestResponse;

    /*
       Se sono state ricevute più risposte,
       uniamo le informazioni disponibili.
    */

    if (responses.length > 1) {

        combinedData = {
            responses: responses
                .filter(r => r.ok)
                .map(r => r.data)
        };
    }

    const allMatches = [];

    responses.forEach(response => {

        if (!response.ok) return;

        const matches =
            findMatchRecords(response.data);

        matches.forEach(match => {

            if (!allMatches.includes(match)) {
                allMatches.push(match);
            }

        });
    });

    const future =
        futureMatches(allMatches);

    document.getElementById("foundNumber").textContent =
        document.__foundData;

    document.getElementById("report").style.display =
        "block";

    document.getElementById("reportContent").innerHTML = `

        <div class="section">

            <div class="sectionTitle">
                Risultato generale
            </div>

            <div class="result">

                <div class="resultTop">

                    <div class="resultName">
                        API raggiunta
                    </div>

                    <div class="badge green">
                        OK
                    </div>

                </div>

                <div class="detail">

                    Risposte HTTP valide:
                    ${successfulResponses}

                    <br>

                    Record di partite riconosciuti:
                    ${allMatches.length}

                    <br>

                    Partite nei prossimi 7 giorni:
                    ${future.length}

                </div>

            </div>

        </div>


        <div class="section">

            <div class="sectionTitle">
                Partite future
            </div>

            ${renderMatches(future)}

        </div>


        <div class="section">

            <div class="sectionTitle">
                Cosa offre l'API
            </div>

            ${renderDataCategories(combinedData)}

        </div>


        <div class="section">

            <div class="sectionTitle">
                Endpoint interrogati
            </div>

            ${renderEndpoints()}

        </div>


        <div class="section">

            <div class="sectionTitle">
                Risposta ricevuta
            </div>

            <div class="note">
                Questa è una parte della risposta reale
                ricevuta dall'API. Serve anche per controllare
                manualmente quali dati vengono restituiti.
            </div>

            ${renderRaw(bestResponse)}

        </div>

    `;

    document.getElementById("foundNumber").textContent =
        document.__foundData;

    setStatus(
        "Analisi completata.",
        "success"
    );
}


/* =========================================================
   CANCELLA
   ========================================================= */

function clearAll() {

    document.getElementById("apiUrl").value = "";
    document.getElementById("apiKey").value = "";

    document.getElementById("report").style.display =
        "none";

    document.getElementById("status").className =
        "status";

    document.getElementById("status").textContent =
        "";

    requests = 0;
    errors = 0;
    testedEndpoints = [];
    responses = [];

    document.getElementById("requestsNumber").textContent =
        "0";

    document.getElementById("endpointNumber").textContent =
        "0";

    document.getElementById("foundNumber").textContent =
        "0";

    document.getElementById("errorNumber").textContent =
        "0";
}

</script>

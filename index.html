<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>API Tester</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #f5f5f7;
    color: #111;
}

.container {
    max-width: 900px;
    margin: 0 auto;
}

h1 {
    margin: 0 0 6px;
    font-size: 30px;
}

.subtitle {
    color: #666;
    margin-bottom: 22px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
}

label {
    display: block;
    font-weight: 600;
    margin-bottom: 7px;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #d1d1d6;
    border-radius: 12px;
    font-size: 16px;
    margin-bottom: 15px;
    outline: none;
}

input:focus {
    border-color: #007aff;
}

.buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

button {
    border: 0;
    border-radius: 12px;
    padding: 14px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
}

#testButton {
    background: #007aff;
    color: white;
}

#clearButton {
    background: #e5e5ea;
    color: #111;
}

button:disabled {
    opacity: .5;
    cursor: default;
}

.status {
    margin-top: 15px;
    padding: 13px;
    border-radius: 12px;
    display: none;
    font-weight: 600;
}

.status.ok {
    display: block;
    background: #dff7e5;
    color: #176b2c;
}

.status.error {
    display: block;
    background: #ffe1e1;
    color: #9b1717;
}

.status.loading {
    display: block;
    background: #e5f0ff;
    color: #1459a6;
}

.summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 16px;
}

.stat {
    background: #f5f5f7;
    border-radius: 14px;
    padding: 14px;
    text-align: center;
}

.stat-number {
    font-size: 25px;
    font-weight: 700;
}

.stat-label {
    font-size: 13px;
    color: #666;
    margin-top: 3px;
}

.report {
    display: none;
}

.section {
    margin-top: 18px;
}

.section:first-child {
    margin-top: 0;
}

.section-title {
    font-size: 19px;
    font-weight: 700;
    margin-bottom: 10px;
}

.item {
    border: 1px solid #e5e5ea;
    border-radius: 13px;
    padding: 14px;
    margin-bottom: 8px;
}

.item-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.item-name {
    font-weight: 650;
}

.badge {
    padding: 5px 9px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
}

.available {
    background: #dff7e5;
    color: #176b2c;
}

.unavailable {
    background: #ffe1e1;
    color: #9b1717;
}

.unknown {
    background: #fff0c7;
    color: #805d00;
}

.item-detail {
    margin-top: 8px;
    color: #666;
    font-size: 14px;
    line-height: 1.45;
}

pre {
    background: #111;
    color: #eee;
    padding: 15px;
    border-radius: 12px;
    overflow-x: auto;
    font-size: 12px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-break: break-word;
}

.small {
    color: #777;
    font-size: 13px;
    line-height: 1.4;
}

@media (max-width: 600px) {
    body {
        padding: 12px;
    }

    .card {
        padding: 16px;
        border-radius: 15px;
    }

    .summary {
        grid-template-columns: 1fr 1fr 1fr;
    }

    .stat {
        padding: 10px 5px;
    }

    .stat-number {
        font-size: 21px;
    }

    .stat-label {
        font-size: 11px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>API Tester</h1>
    <div class="subtitle">
        Inserisci Link API e API Key. Il tester analizzerà automaticamente cosa offre l'API.
    </div>

    <div class="card">

        <label for="apiUrl">Link API</label>
        <input
            id="apiUrl"
            type="url"
            placeholder="https://esempio.com/api"
            autocomplete="off"
        >

        <label for="apiKey">API Key</label>
        <input
            id="apiKey"
            type="password"
            placeholder="Inserisci API Key"
            autocomplete="off"
        >

        <div class="buttons">
            <button id="testButton" onclick="startTest()">
                Analizza API
            </button>

            <button id="clearButton" onclick="clearAll()">
                Cancella
            </button>
        </div>

        <div id="status" class="status"></div>

    </div>

    <div id="report" class="card report">

        <div class="summary">
            <div class="stat">
                <div id="requestCount" class="stat-number">0</div>
                <div class="stat-label">Richieste</div>
            </div>

            <div class="stat">
                <div id="availableCount" class="stat-number">0</div>
                <div class="stat-label">Disponibili</div>
            </div>

            <div class="stat">
                <div id="unknownCount" class="stat-number">0</div>
                <div class="stat-label">Non verificati</div>
            </div>
        </div>

        <div id="reportContent"></div>

    </div>

</div>

<script>

/* =========================================================
   CONFIGURAZIONE
   ========================================================= */

const PROXY = "https://little-resonance-5ec5.my5vp6787f.workers.dev/";

let requestCount = 0;
let availableCount = 0;
let unknownCount = 0;


/* =========================================================
   UTILITÀ
   ========================================================= */

function setStatus(text, type) {
    const el = document.getElementById("status");

    el.textContent = text;
    el.className = "status " + type;
}


function normalizeUrl(url) {
    url = url.trim();

    if (!url) return "";

    return url.replace(/\/+$/, "");
}


function isObject(value) {
    return value !== null &&
           typeof value === "object" &&
           !Array.isArray(value);
}


function isUsefulValue(value) {
    if (value === null || value === undefined) return false;

    if (typeof value === "string") {
        return value.trim() !== "";
    }

    if (typeof value === "number" || typeof value === "boolean") {
        return true;
    }

    if (Array.isArray(value)) {
        return value.length > 0;
    }

    if (isObject(value)) {
        return Object.keys(value).length > 0;
    }

    return false;
}


function normalizeKey(key) {
    return String(key)
        .toLowerCase()
        .replace(/[^a-z0-9]/g, "");
}


/* =========================================================
   RICERCA RICORSIVA DEI DATI
   ========================================================= */

function walkObject(value, callback, path = []) {

    if (Array.isArray(value)) {

        value.forEach((item, index) => {
            callback(item, path.concat(index));

            if (typeof item === "object" && item !== null) {
                walkObject(item, callback, path.concat(index));
            }
        });

        return;
    }

    if (!isObject(value)) return;

    Object.keys(value).forEach(key => {

        const currentPath = path.concat(key);
        const currentValue = value[key];

        callback(currentValue, currentPath);

        if (typeof currentValue === "object" &&
            currentValue !== null) {

            walkObject(currentValue, callback, currentPath);
        }
    });
}


function findKeys(data, aliases) {

    const wanted = aliases.map(normalizeKey);
    const results = [];

    walkObject(data, (value, path) => {

        if (!path.length) return;

        const key = path[path.length - 1];

        if (typeof key !== "string") return;

        const normalized = normalizeKey(key);

        if (!wanted.includes(normalized)) return;

        if (!isUsefulValue(value)) return;

        results.push({
            key: key,
            path: path.join("."),
            value: value
        });
    });

    return results;
}


function findFirst(data, aliases) {
    const results = findKeys(data, aliases);

    return results.length ? results[0] : null;
}


/* =========================================================
   INDIVIDUAZIONE DEI RECORD DI PARTITA
   ========================================================= */

function looksLikeMatch(obj) {

    if (!isObject(obj)) return false;

    const keys = Object.keys(obj).map(normalizeKey);

    const hasId =
        keys.includes("id") ||
        keys.includes("fixtureid") ||
        keys.includes("matchid") ||
        keys.includes("gameid");

    const hasDate =
        keys.includes("date") ||
        keys.includes("datetime") ||
        keys.includes("kickoff") ||
        keys.includes("starttime") ||
        keys.includes("fixturedate");

    const hasTeams =
        keys.includes("teams") ||
        keys.includes("hometeam") ||
        keys.includes("awayteam") ||
        keys.includes("hometeamid") ||
        keys.includes("awayteamid") ||
        keys.includes("home") ||
        keys.includes("away");

    return (hasId && hasDate) ||
           (hasDate && hasTeams);
}


function collectMatchRecords(data) {

    const records = [];

    function scan(value) {

        if (Array.isArray(value)) {

            for (const item of value) {

                if (looksLikeMatch(item)) {
                    records.push(item);
                }

                scan(item);
            }

            return;
        }

        if (!isObject(value)) return;

        if (looksLikeMatch(value)) {
            records.push(value);
        }

        Object.values(value).forEach(scan);
    }

    scan(data);

    return records;
}


/* =========================================================
   DATA
   ========================================================= */

function parseDate(value) {

    if (!value) return null;

    if (typeof value !== "string" &&
        typeof value !== "number") {
        return null;
    }

    const date = new Date(value);

    if (isNaN(date.getTime())) return null;

    return date;
}


function getMatchDate(match) {

    const result = findFirst(match, [
        "date",
        "datetime",
        "kickoff",
        "start_time",
        "startTime",
        "fixture_date",
        "fixtureDate"
    ]);

    return result ? result.value : null;
}


function getMatchId(match) {

    const result = findFirst(match, [
        "fixture_id",
        "fixtureId",
        "match_id",
        "matchId",
        "game_id",
        "gameId",
        "id"
    ]);

    return result ? result.value : null;
}


function getTeamValue(match, type) {

    if (type === "home") {

        const direct = findFirst(match, [
            "homeTeam",
            "home_team",
            "hometeam"
        ]);

        if (direct) return direct.value;

        const home = findFirst(match, ["home"]);

        if (home) return home.value;
    }

    if (type === "away") {

        const direct = findFirst(match, [
            "awayTeam",
            "away_team",
            "awayteam"
        ]);

        if (direct) return direct.value;

        const away = findFirst(match, ["away"]);

        if (away) return away.value;
    }

    return null;
}


function valueToText(value) {

    if (value === null || value === undefined) {
        return "";
    }

    if (typeof value === "object") {

        if (value.name) return value.name;
        if (value.shortName) return value.shortName;
        if (value.title) return value.title;
        if (value.id !== undefined) {
            return "ID " + value.id;
        }

        return JSON.stringify(value);
    }

    return String(value);
}


/* =========================================================
   CHIAMATA API
   ========================================================= */

async function apiRequest(url, apiKey) {

    requestCount++;

    document.getElementById("requestCount").textContent =
        requestCount;

    const target =
        PROXY +
        "?url=" +
        encodeURIComponent(url) +
        "&key=" +
        encodeURIComponent(apiKey);

    try {

        const response = await fetch(target, {
            method: "GET"
        });

        const text = await response.text();

        let data;

        try {
            data = JSON.parse(text);
        } catch {
            data = {
                raw: text
            };
        }

        return {
            ok: response.ok,
            status: response.status,
            data: data,
            raw: text
        };

    } catch (error) {

        return {
            ok: false,
            status: 0,
            data: null,
            raw: "",
            error: error.message
        };
    }
}


/* =========================================================
   URL CANDIDATE
   ========================================================= */

function buildCandidates(baseUrl) {

    const today = new Date();

    const end = new Date(today);
    end.setDate(end.getDate() + 7);

    function dateString(date) {
        return date.toISOString().slice(0, 10);
    }

    const from = dateString(today);
    const to = dateString(end);

    return [
        baseUrl + "/fixtures?next=20",

        baseUrl + "/fixtures?from=" +
        encodeURIComponent(from) +
        "&to=" +
        encodeURIComponent(to),

        baseUrl + "/fixtures?date=" +
        encodeURIComponent(from),

        baseUrl + "/matches?from=" +
        encodeURIComponent(from) +
        "&to=" +
        encodeURIComponent(to),

        baseUrl + "/matches?date=" +
        encodeURIComponent(from)
    ];
}


/* =========================================================
   ANALISI DI UNA RISPOSTA
   ========================================================= */

function analyzeResponse(data) {

    const matches = collectMatchRecords(data);

    const result = {
        matches: matches,
        fields: {
            id: findFirst(data, [
                "id",
                "fixture_id",
                "fixtureId",
                "match_id",
                "matchId"
            ]),

            date: findFirst(data, [
                "date",
                "datetime",
                "kickoff",
                "start_time",
                "startTime",
                "fixture_date",
                "fixtureDate"
            ]),

            home: findFirst(data, [
                "homeTeam",
                "home_team",
                "hometeam",
                "home"
            ]),

            away: findFirst(data, [
                "awayTeam",
                "away_team",
                "awayteam",
                "away"
            ]),

            status: findFirst(data, [
                "status",
                "match_status",
                "fixture_status"
            ]),

            league: findFirst(data, [
                "league",
                "competition",
                "tournament"
            ]),

            season: findFirst(data, [
                "season",
                "year"
            ]),

            venue: findFirst(data, [
                "venue",
                "stadium"
            ]),

            referee: findFirst(data, [
                "referee",
                "official"
            ]),

            round: findFirst(data, [
                "round",
                "matchday",
                "week"
            ]),

            score: findFirst(data, [
                "score",
                "result"
            ]),

            goals: findFirst(data, [
                "goals",
                "goal"
            ]),

            statistics: findFirst(data, [
                "statistics",
                "stats",
                "match_statistics"
            ]),

            lineup: findFirst(data, [
                "lineups",
                "lineup",
                "formations"
            ]),

            injuries: findFirst(data, [
                "injuries",
                "injury",
                "unavailable"
            ]),

            odds: findFirst(data, [
                "odds",
                "betting"
            ]),

            players: findFirst(data, [
                "players",
                "player"
            ]),

            h2h: findFirst(data, [
                "h2h",
                "headtohead",
                "head_to_head"
            ])
        }
    };

    return result;
}


/* =========================================================
   REPORT
   ========================================================= */

function fieldRow(name, result) {

    if (result) {

        availableCount++;

        return `
            <div class="item">
                <div class="item-head">
                    <div class="item-name">${escapeHtml(name)}</div>
                    <div class="badge available">DISPONIBILE</div>
                </div>

                <div class="item-detail">
                    Campo trovato: <b>${escapeHtml(result.path)}</b><br>
                    Esempio: ${escapeHtml(valueToText(result.value).slice(0, 250))}
                </div>
            </div>
        `;
    }

    unknownCount++;

    return `
        <div class="item">
            <div class="item-head">
                <div class="item-name">${escapeHtml(name)}</div>
                <div class="badge unknown">NON VERIFICATO</div>
            </div>

            <div class="item-detail">
                Il tester non ha trovato questo dato nella risposta analizzata.
                Questo non significa necessariamente che l'API non lo offra.
            </div>
        </div>
    `;
}


function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function renderReport(analysis, firstResponse, futureMatches) {

    const report = document.getElementById("report");
    const content = document.getElementById("reportContent");

    availableCount = 0;
    unknownCount = 0;

    let html = "";

    html += `
        <div class="section">
            <div class="section-title">Partite future</div>

            <div class="item">
                <div class="item-head">
                    <div class="item-name">Partite individuate nei prossimi 7 giorni</div>
                    <div class="badge ${
                        futureMatches.length > 0
                            ? "available"
                            : "unknown"
                    }">
                        ${
                            futureMatches.length > 0
                                ? "TROVATE"
                                : "NON VERIFICATO"
                        }
                    </div>
                </div>

                <div class="item-detail">
                    ${futureMatches.length}
                    record di partita individuati nelle risposte analizzate.
                </div>
            </div>
        </div>
    `;

    html += `
        <div class="section">
            <div class="section-title">Dati delle partite</div>
    `;

    html += fieldRow("ID partita", analysis.fields.id);
    html += fieldRow("Data e ora", analysis.fields.date);
    html += fieldRow("Squadra casa", analysis.fields.home);
    html += fieldRow("Squadra ospite", analysis.fields.away);
    html += fieldRow("Stato partita", analysis.fields.status);
    html += fieldRow("Campionato", analysis.fields.league);
    html += fieldRow("Stagione", analysis.fields.season);
    html += fieldRow("Stadio / sede", analysis.fields.venue);
    html += fieldRow("Arbitro", analysis.fields.referee);
    html += fieldRow("Giornata / turno", analysis.fields.round);

    html += `</div>`;

    html += `
        <div class="section">
            <div class="section-title">Dati aggiuntivi</div>
    `;

    html += fieldRow("Risultato", analysis.fields.score);
    html += fieldRow("Gol", analysis.fields.goals);
    html += fieldRow("Statistiche partita", analysis.fields.statistics);
    html += fieldRow("Formazioni / line-up", analysis.fields.lineup);
    html += fieldRow("Infortuni / indisponibili", analysis.fields.injuries);
    html += fieldRow("Quote", analysis.fields.odds);
    html += fieldRow("Giocatori", analysis.fields.players);
    html += fieldRow("Testa a testa (H2H)", analysis.fields.h2h);

    html += `</div>`;

    if (futureMatches.length > 0) {

        html += `
            <div class="section">
                <div class="section-title">Prime partite trovate</div>
        `;

        futureMatches.slice(0, 10).forEach(match => {

            const id = getMatchId(match);
            const date = getMatchDate(match);
            const home = getTeamValue(match, "home");
            const away = getTeamValue(match, "away");

            html += `
                <div class="item">
                    <div class="item-name">
                        ${escapeHtml(valueToText(home) || "Casa")}
                        —
                        ${escapeHtml(valueToText(away) || "Ospite")}
                    </div>

                    <div class="item-detail">
                        ID: ${escapeHtml(valueToText(id) || "non trovato")}<br>
                        Data: ${escapeHtml(valueToText(date) || "non trovata")}
                    </div>
                </div>
            `;
        });

        html += `</div>`;
    }

    html += `
        <div class="section">
            <div class="section-title">Risposta API analizzata</div>

            <div class="small">
                Questa è la risposta reale ricevuta dall'API.
                Serve per capire esattamente quali dati restituisce.
            </div>

            <pre>${escapeHtml(
                JSON.stringify(
                    firstResponse,
                    null,
                    2
                ).slice(0, 30000)
            )}</pre>
        </div>
    `;

    content.innerHTML = html;

    document.getElementById("availableCount").textContent =
        availableCount;

    document.getElementById("unknownCount").textContent =
        unknownCount;

    document.getElementById("requestCount").textContent =
        requestCount;

    report.style.display = "block";
}


/* =========================================================
   TEST PRINCIPALE
   ========================================================= */

async function startTest() {

    const inputUrl =
        document.getElementById("apiUrl").value;

    const apiKey =
        document.getElementById("apiKey").value.trim();

    if (!inputUrl) {
        setStatus("Inserisci il Link API.", "error");
        return;
    }

    if (!apiKey) {
        setStatus("Inserisci la API Key.", "error");
        return;
    }

    let baseUrl = normalizeUrl(inputUrl);

    try {
        new URL(baseUrl);
    } catch {
        setStatus("Il Link API non è valido.", "error");
        return;
    }

    requestCount = 0;
    availableCount = 0;
    unknownCount = 0;

    document.getElementById("report").style.display = "none";
    document.getElementById("testButton").disabled = true;

    setStatus(
        "Sto interrogando l'API e analizzando le risposte...",
        "loading"
    );

    const candidates = buildCandidates(baseUrl);

    let bestResponse = null;
    let bestAnalysis = null;
    let bestMatches = [];

    for (const url of candidates) {

        const response =
            await apiRequest(url, apiKey);

        if (!response.ok) {
            continue;
        }

        if (!response.data) {
            continue;
        }

        const analysis =
            analyzeResponse(response.data);

        const matches =
            analysis.matches;

        if (
            !bestResponse ||
            matches.length > bestMatches.length
        ) {
            bestResponse = response.data;
            bestAnalysis = analysis;
            bestMatches = matches;
        }

        if (matches.length > 0) {
            break;
        }
    }

    document.getElementById("testButton").disabled = false;

    if (!bestResponse) {

        setStatus(
            "L'API non ha restituito una risposta utilizzabile. Controlla Link API, API Key e configurazione del proxy.",
            "error"
        );

        return;
    }

    renderReport(
        bestAnalysis,
        bestResponse,
        bestMatches
    );

    if (bestMatches.length > 0) {

        setStatus(
            "Analisi completata: sono state trovate partite e dati utilizzabili.",
            "ok"
        );

    } else {

        setStatus(
            "API raggiunta, ma nei test effettuati non sono state trovate partite. Guarda il report e la risposta reale ricevuta.",
            "error"
        );
    }
}


/* =========================================================
   CANCELLA
   ========================================================= */

function clearAll() {

    document.getElementById("apiUrl").value = "";
    document.getElementById("apiKey").value = "";

    document.getElementById("report").style.display = "none";

    document.getElementById("status").className =
        "status";

    document.getElementById("status").textContent = "";

    requestCount = 0;
    availableCount = 0;
    unknownCount = 0;

    document.getElementById("requestCount").textContent = "0";
    document.getElementById("availableCount").textContent = "0";
    document.getElementById("unknownCount").textContent = "0";
}

</script>

</body>
</html>

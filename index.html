<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>API Tester Universale</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f6f8;
    color: #111;
}

.container {
    max-width: 900px;
    margin: 0 auto;
}

h1 {
    margin: 0 0 8px;
    font-size: 28px;
}

.subtitle {
    color: #666;
    margin-bottom: 22px;
}

.card {
    background: white;
    border-radius: 16px;

    margin-bottom: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,.06);
}

label {
    display: block;
    font-weight: 600;
    margin-bottom: 7px;
}

input {
    width: 100%;
    padding: 13px 14px;
    border: 1px solid #d8dbe0;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
    background: #fff;
    margin-bottom: 15px;
}

input:focus {
    border-color: #111;
}

.buttons {
    display: flex;
    gap: 10px;
}

button {
    flex: 1;
    border: 0;
    border-radius: 11px;
    padding: 14px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
}

#startBtn {
    background: #111;
    color: white;
}

#clearBtn {
    background: #e9eaed;
    color: #111;
}

button:disabled {
    opacity: .5;
}

.status {
    padding: 14px;
    border-radius: 11px;
    background: #f0f1f3;
    margin-bottom: 16px;
    line-height: 1.45;
}

.status.ok {
    background: #e8f7ed;
    color: #176b35;
}

.status.error {
    background: #fdecec;
    color: #a32020;
}

.counters {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 16px;
}

.counter {
    background: white;

    box-shadow: 0 2px 12px rgba(0,0,0,.05);
}

.counter-number {
    font-size: 25px;

}

    margin-top: 3px;
}

.section {
    margin-top: 18px;
}

.section-title {
    font-size: 18px;
    font-weight: 800;
    margin-bottom: 10px;
}

.result-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 15px;

.result-name {

.result-detail {

    color: #16713a;
}

.badge.no {
    background: #f0f1f3;
    color: #777;
}

.badge.warn {
    background: #fff2d9;
    color: #8a5b00;
}

.endpoint {
    font-family: monospace;
    font-size: 12px;
    word-break: break-all;
    color: #555;
    background: #f5f6f8;
    padding: 8px;
    border-radius: 7px;
    margin-top: 6px;
}

    display: none;
}

@media (max-width: 600px) {
    body {
        padding: 12px;
    }

    .counters {
        grid-template-columns: repeat(2, 1fr);
    }

    h1 {
        font-size: 24px;
    }

    .result-row {
        gap: 8px;
    }
</style>
</head>

<body>

<div class="container">

    <h1>API Tester Universale</h1>
    <div class="subtitle">
        Inserisci solamente il link dell'API e la chiave. Il tester cerca automaticamente la struttura reale dell'API.
    </div>

    <div class="card">

        <label for="apiUrl">Link API</label>
        <input
            id="apiUrl"
            type="url"
            placeholder="https://esempio.com/api"
            autocomplete="off"
            autocapitalize="none"
            spellcheck="false"
        >

        <label for="apiKey">API Key</label>
        <input
            id="apiKey"
            type="password"
            placeholder="Inserisci la tua API Key"
            autocomplete="off"
        >

            <button id="startBtn">Analizza API</button>
            <button id="clearBtn">Cancella</button>
        </div>

    </div>

    <div id="status" class="status">
        Pronto per il test.
    </div>

    <div class="counters">
        <div class="counter">
            <div id="requestCount" class="counter-number">0</div>
            <div class="counter-label">Richieste</div>
        </div>

            <div id="endpointCount" class="counter-number">0</div>
            <div class="counter-label">Endpoint trovati</div>
        </div>

        <div class="counter">
            <div id="dataCount" class="counter-number">0</div>
            <div class="counter-label">Dati trovati</div>
        </div>

        <div class="counter">
            <div id="errorCount" class="counter-number">0</div>
            <div class="counter-label">Errori</div>
        </div>
    </div>

    <div id="report" class="card hidden">

        <div class="section">
            <div class="section-title">Risultato generale</div>

            <div id="generalResult"></div>
        </div>

        <div class="section">
            <div class="section-title">Partite future</div>

            <div id="futureResult"></div>
        </div>

        <div class="section">
            <div class="section-title">Funzionalità rilevate</div>

            <div id="featuresResult"></div>
        </div>

        <div class="section">
            <div class="section-title">Struttura API</div>

            <div id="structureResult"></div>
        </div>

    </div>

</div>

<script>

/* =========================================================
   CONFIGURAZIONE
   ========================================================= */

const PROXY =
    "https://little-resonance-5ec5.my5vp6787f.workers.dev/";

const MAX_REQUESTS = 18;

let requestCount = 0;
let endpointCount = 0;
let dataCount = 0;
let errorCount = 0;

let discoveredEndpoints = [];
let successfulResponses = [];


/* =========================================================
   ELEMENTI
   ========================================================= */

const apiUrlInput = document.getElementById("apiUrl");
const apiKeyInput = document.getElementById("apiKey");

const startBtn = document.getElementById("startBtn");
const clearBtn = document.getElementById("clearBtn");

const statusBox = document.getElementById("status");
const report = document.getElementById("report");

const requestCountEl = document.getElementById("requestCount");
const endpointCountEl = document.getElementById("endpointCount");
const dataCountEl = document.getElementById("dataCount");
const errorCountEl = document.getElementById("errorCount");

const generalResult = document.getElementById("generalResult");
const futureResult = document.getElementById("futureResult");
const featuresResult = document.getElementById("featuresResult");
const structureResult = document.getElementById("structureResult");


/* =========================================================
   UTILITY
   ========================================================= */

function normalizeUrl(value) {

    value = value.trim();

    if (!value) {
        throw new Error("Inserisci il link dell'API.");
    }

    if (!/^https?:\/\//i.test(value)) {
        value = "https://" + value;
    }

    return value.replace(/\/+$/, "");
}


function updateCounters() {

    requestCountEl.textContent = requestCount;
    endpointCountEl.textContent = endpointCount;
    dataCountEl.textContent = dataCount;
    errorCountEl.textContent = errorCount;
}


function setStatus(text, type = "") {

    statusBox.textContent = text;

    statusBox.className = "status";

    if (type) {
        statusBox.classList.add(type);
    }
}


function escapeHtml(value) {

    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function addEndpoint(url) {

    if (!discoveredEndpoints.includes(url)) {

        discoveredEndpoints.push(url);

        endpointCount = discoveredEndpoints.length;

        updateCounters();
    }
}


function isObject(value) {

    return value !== null &&
           typeof value === "object";
}


function flattenObjects(value, result = []) {

    if (Array.isArray(value)) {

        for (const item of value) {
            flattenObjects(item, result);
        }

        return result;
    }

    if (isObject(value)) {

        result.push(value);

        for (const key of Object.keys(value)) {

            const child = value[key];

            if (isObject(child) || Array.isArray(child)) {
                flattenObjects(child, result);
            }
        }
    }

    return result;
}


function normalizeText(value) {

    return String(value || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
}


/* =========================================================
   URL / QUERY HELPERS
   ========================================================= */

function getBaseOrigin(url) {

    try {
        return new URL(url).origin;
    } catch {
        return url;
    }
}


function joinUrl(base, path) {

    if (!path) {
        return base;
    }

    if (/^https?:\/\//i.test(path)) {
        return path;
    }

    try {

        return new URL(
            path.startsWith("/") ? path : "/" + path,
            base.endsWith("/") ? base : base + "/"
        ).toString().replace(/\/+$/, "");

    } catch {

        return base.replace(/\/+$/, "") +
               "/" +
               path.replace(/^\/+/, "");
    }
}


function addQuery(url, params) {

    try {

        const u = new URL(url);

        for (const [key, value] of Object.entries(params)) {

            if (
                value !== undefined &&
                value !== null &&
                value !== ""
            ) {
                u.searchParams.set(key, value);
            }
        }

        return u.toString();

    } catch {

        return url;
    }
}


/* =========================================================
   RICHIESTA ATTRAVERSO PROXY
   ========================================================= */

async function requestApi(targetUrl) {

    if (requestCount >= MAX_REQUESTS) {
        throw new Error("Limite di sicurezza delle richieste raggiunto.");
    }

    requestCount++;
    updateCounters();

    const proxyUrl =
        PROXY +
        "?url=" +
        encodeURIComponent(targetUrl) +
        "&key=" +
        encodeURIComponent(apiKeyInput.value.trim());

    try {

        const response = await fetch(proxyUrl, {
            method: "GET",
            cache: "no-store"
        });

        const text = await response.text();

        let data;

        try {
            data = JSON.parse(text);
        } catch {
            data = text;
        }

        if (!response.ok) {

            errorCount++;
            updateCounters();

            return {
                ok: false,
                status: response.status,
                data,
                url: targetUrl
            };
        }

        successfulResponses.push({
            url: targetUrl,
            status: response.status,
            data
        });

        return {
            ok: true,
            status: response.status,
            data,
            url: targetUrl
        };

    } catch (error) {

        errorCount++;
        updateCounters();

        return {
            ok: false,
            status: 0,
            data: null,
            error: error.message,
            url: targetUrl
        };
    }
}


/* =========================================================
   SCOPERTA DOCUMENTAZIONE
   ========================================================= */

function buildDocumentationUrls(baseUrl) {

    const origin = getBaseOrigin(baseUrl);

    const paths = [

        "/openapi.json",
        "/openapi.yaml",
        "/swagger.json",
        "/swagger.yaml",
        "/api-docs",
        "/api-docs/",
        "/docs",
        "/docs/",
        "/redoc",
        "/swagger",
        "/swagger/",
        "/swagger/v1/swagger.json",
        "/v1/swagger.json",
        "/api/openapi.json",
        "/api/swagger.json",
        "/api/docs",
        "/api-docs.json"

    ];

    return paths.map(path => joinUrl(origin, path));
}


/* =========================================================
   IDENTIFICAZIONE OPENAPI
   ========================================================= */

function isOpenApi(data) {

    if (!isObject(data)) {
        return false;
    }

    return (
        isObject(data.paths) ||
        isObject(data.openapi) ||
        isObject(data.swagger)
    );
}


function extractOpenApiPaths(data) {

    const result = [];

    if (!isObject(data) || !isObject(data.paths)) {
        return result;
    }

    for (const path of Object.keys(data.paths)) {

        const methods = data.paths[path];

        if (!isObject(methods)) {
            continue;
        }

        for (const method of Object.keys(methods)) {

            const allowed = [
                "get",
                "post",
                "put",
                "patch",
                "delete"
            ];

            if (!allowed.includes(method.toLowerCase())) {
                continue;
            }

            result.push({
                path,
                method: method.toUpperCase(),
                operation: methods[method]
            });
        }
    }

    return result;
}


/* =========================================================
   ANALISI SEMANTICA DEGLI ENDPOINT
   ========================================================= */

function endpointScore(path, operation) {

    const text = normalizeText(
        path + " " +
        JSON.stringify(operation || {})
    );

    let score = 0;

    const groups = {

        matches: [
            "fixture",
            "fixtures",
            "match",
            "matches",
            "game",
            "games",
            "event",
            "events",
            "schedule",
            "schedules"
        ],

        leagues: [
            "league",
            "leagues",
            "competition",
            "competitions",
            "tournament",
            "tournaments"
        ],

        teams: [
            "team",
            "teams",
            "club",
            "clubs"
        ],

        players: [
            "player",
            "players"
        ],

        statistics: [
            "stat",
            "stats",
            "statistics"
        ],

        standings: [
            "standing",
            "standings",
            "table"
        ],

        injuries: [
            "injur",
            "injuries",
            "sidelined",
            "availability",
            "absent",
            "unavailable"
        ],

        odds: [
            "odds",
            "betting",
            "bookmaker"
        ],

        lineups: [
            "lineup",
            "lineups",
            "formation",
            "formations"
        ],

        h2h: [
            "h2h",
            "headtohead",
            "head-to-head"
        ]
    };

    for (const words of Object.values(groups)) {

        for (const word of words) {

            if (text.includes(word)) {
                score++;
            }
        }
    }

    return score;
}


/* =========================================================
   PARAMETRI OPENAPI
   ========================================================= */

function getOperationParameters(operation) {

    if (!isObject(operation)) {
        return [];
    }

    if (!Array.isArray(operation.parameters)) {
        return [];
    }

    return operation.parameters;
}


function parameterNames(operation) {

    return getOperationParameters(operation)
        .map(p => normalizeText(p.name))
        .filter(Boolean);
}


function findParameter(operation, names) {

    const params = getOperationParameters(operation);

    for (const wanted of names) {

        const found = params.find(p =>
            normalizeText(p.name) === normalizeText(wanted)
        );

        if (found) {
            return found;
        }
    }

    return null;
}


function buildDateAwareUrl(baseUrl, path, operation) {

    let url = joinUrl(
        getBaseOrigin(baseUrl),
        path
    );

    const params = parameterNames(operation);

    const now = new Date();

    const today =
        now.toISOString().slice(0, 10);

    const future = new Date(now);

    future.setDate(
        future.getDate() + 7
    );

    const futureDate =
        future.toISOString().slice(0, 10);

    const fromNames = [
        "from",
        "start",
        "start_date",
        "startdate",
        "date_from",
        "datefrom",
        "begin",
        "begin_date"
    ];

    const toNames = [
        "to",
        "end",
        "end_date",
        "enddate",
        "date_to",
        "dateto"
    ];

    const dateNames = [
        "date",
        "match_date",
        "matchdate",
        "game_date",
        "gamedate"
    ];

    const from = fromNames.find(
        n => params.includes(normalizeText(n))
    );

    const to = toNames.find(
        n => params.includes(normalizeText(n))
    );

    const date = dateNames.find(
        n => params.includes(normalizeText(n))
    );

    if (from) {
        url = addQuery(url, {
            [from]: today
        });
    }

    if (to) {
        url = addQuery(url, {
            [to]: futureDate
        });
    }

    if (!from && !to && date) {

        url = addQuery(url, {
            [date]: today
        });
    }

    return url;
}


/* =========================================================
   RICERCA CAMPI
   ========================================================= */

const FIELD_GROUPS = {

    partita: [
        "fixture",
        "fixtures",
        "match",
        "matches",
        "game",
        "games",
        "event",
        "events"
    ],

    idPartita: [
        "fixture_id",
        "fixtureid",
        "match_id",
        "matchid",
        "game_id",
        "gameid",
        "event_id",
        "eventid"
    ],

    data: [
        "date",
        "datetime",
        "date_time",
        "start_time",
        "starttime",
        "match_date",
        "matchdate"
    ],

    casa: [
        "home",
        "home_team",
        "hometeam",
        "home_name",
        "home_team_name"
    ],

    ospite: [
        "away",
        "away_team",
        "awayteam",
        "away_name",
        "away_team_name"
    ],

    campionato: [
        "league",
        "competition",
        "tournament",
        "championship"
    ],

    stagione: [
        "season",
        "season_id",
        "year"
    ],

    stato: [
        "status",
        "state",
        "match_status"
    ],

    risultato: [
        "score",
        "scores",
        "result",
        "results"
    ],

    gol: [
        "goals",
        "goal",
        "goals_home",
        "goals_away"
    ],

    statistiche: [
        "statistics",
        "stats",
        "statistic"
    ],

    possesso: [
        "possession",
        "ball_possession"
    ],

    tiri: [
        "shots",
        "shots_on_target",
        "total_shots"
    ],

    corner: [
        "corner",
        "corners"
    ],

    cartellini: [
        "cards",
        "yellow_cards",
        "red_cards"
    ],

    xg: [
        "xg",
        "expected_goals",
        "expectedgoals"
    ],

    formazioni: [
        "lineup",
        "lineups",
        "formation",
        "formations"
    ],

    giocatori: [
        "players",
        "player",
        "player_stats",
        "playerstats"
    ],

    infortuni: [
        "injuries",
        "injury",
        "sidelined",
        "availability",
        "unavailable",
        "absent"
    ],

    quote: [
        "odds",
        "bookmaker",
        "betting"
    ],

    classifica: [
        "standings",
        "standing",
        "table"
    ],

    h2h: [
        "h2h",
        "head_to_head",
        "headtohead"
    ],

    stadio: [
        "venue",
        "stadium"
    ],

    arbitro: [
        "referee",
        "official"
    ]
};


function findSemanticFields(data) {

    const objects = flattenObjects(data);

    const found = {};

    for (const [group, aliases] of Object.entries(FIELD_GROUPS)) {

        found[group] = null;

        for (const object of objects) {

            const keys =
                Object.keys(object)
                    .map(normalizeText);

            const match = aliases.find(alias =>
                keys.includes(normalizeText(alias))
            );

            if (match) {

                const originalKey =
                    Object.keys(object).find(key =>
                        normalizeText(key) === normalizeText(match)
                    );

                found[group] = originalKey;
                break;
            }
        }
    }

    return found;
}


/* =========================================================
   RICONOSCIMENTO PARTITE
   ========================================================= */

function looksLikeMatchObject(obj) {

    if (!isObject(obj)) {
        return false;
    }

    const keys =
        Object.keys(obj).map(normalizeText);

    const hasDate =
        keys.some(k =>
            FIELD_GROUPS.data.some(a =>
                normalizeText(a) === k
            )
        );

    const hasHome =
        keys.some(k =>
            FIELD_GROUPS.casa.some(a =>
                normalizeText(a) === k
            )
        );

    const hasAway =
        keys.some(k =>
            FIELD_GROUPS.ospite.some(a =>
                normalizeText(a) === k
            )
        );

    const hasMatchId =
        keys.some(k =>
            FIELD_GROUPS.idPartita.some(a =>
                normalizeText(a) === k
            )
        );

    return (
        (hasHome && hasAway) ||
        (hasDate && hasHome) ||
        (hasDate && hasAway) ||
        (hasMatchId && (hasHome || hasAway))
    );
}


function extractMatchObjects(data) {

    const objects = flattenObjects(data);

    return objects.filter(
        looksLikeMatchObject
    );
}


/* =========================================================
   RICONOSCIMENTO DATE
   ========================================================= */

function parsePossibleDate(value) {

    if (
        typeof value !== "string" &&
        typeof value !== "number"
    ) {
        return null;
    }

    const date = new Date(value);

    if (isNaN(date.getTime())) {
        return null;
    }

    return date;
}


function findDateInObject(obj) {

    const keys =
        Object.keys(obj);

    for (const key of keys) {

        const normalized =
            normalizeText(key);

        const possible =
            FIELD_GROUPS.data.some(
                x => normalizeText(x) === normalized
            );

        if (!possible) {
            continue;
        }

        const date =
            parsePossibleDate(obj[key]);

        if (date) {
            return date;
        }
    }

    return null;
}


function getFutureMatches(matches) {

    const now = new Date();

    const end = new Date(now);

    end.setDate(
        end.getDate() + 7
    );

    return matches.filter(match => {

        const date =
            findDateInObject(match);

        if (!date) {
            return false;
        }

        return date >= now &&
               date <= end;
    });
}


/* =========================================================
   RICERCA ENDPOINT DALLO SCHEMA
   ========================================================= */

function findRelevantOperations(openApiData) {

    const paths =
        extractOpenApiPaths(openApiData);

    const scored =
        paths.map(item => ({
            ...item,
            score: endpointScore(
                item.path,
                item.operation
            )
        }));

    scored.sort(
        (a, b) => b.score - a.score
    );

    return scored;
}


/* =========================================================
   PROBE MINIMALE DI ENDPOINT
   ========================================================= */

async function probeOperations(
    baseUrl,
    operations,
    limit = 7
) {

    const results = [];

    const selected =
        operations
            .filter(x => x.method === "GET")
            .slice(0, limit);

    for (const operation of selected) {

        if (requestCount >= MAX_REQUESTS) {
            break;
        }

        const target =
            buildDateAwareUrl(
                baseUrl,
                operation.path,
                operation.operation
            );

        addEndpoint(target);

        setStatus(
            "Analizzo endpoint: " +
            operation.path
        );

        const response =
            await requestApi(target);

        if (response.ok) {

            const matches =
                extractMatchObjects(
                    response.data
                );

            const fields =
                findSemanticFields(
                    response.data
                );

            const objectCount =
                flattenObjects(
                    response.data
                ).length;

            dataCount += objectCount;

            updateCounters();

            results.push({
                ...operation,
                target,
                response,
                matches,
                fields,
                objectCount
            });
        }
    }

    return results;
}


/* =========================================================
   RICERCA DIRETTA SE NON ESISTE OPENAPI
   ========================================================= */

function buildFallbackEndpoints(baseUrl) {

    const origin =
        getBaseOrigin(baseUrl);

    const paths = [

        "/",
        "/api",
        "/v1",
        "/api/v1",

        "/fixtures",
        "/matches",
        "/games",
        "/events",

        "/fixtures/today",
        "/matches/today",
        "/games/today",
        "/events/today",

        "/fixtures/upcoming",
        "/matches/upcoming",
        "/games/upcoming",
        "/events/upcoming",

        "/fixtures/next",
        "/matches/next",
        "/games/next",
        "/events/next"

    ];

    return paths.map(
        path => joinUrl(origin, path)
    );
}


/* =========================================================
   ESTRAZIONE LINK DALLA RISPOSTA
   ========================================================= */

function extractUrlsFromObject(data) {

    const urls = [];

    const objects =
        flattenObjects(data);

    for (const obj of objects) {

        for (const value of Object.values(obj)) {

            if (
                typeof value === "string" &&
                /^https?:\/\//i.test(value)
            ) {
                urls.push(value);
            }
        }
    }

    return [...new Set(urls)];
}


/* =========================================================
   ANALISI DELLA RISPOSTA
   ========================================================= */

function analyzeResponses() {

    let allMatches = [];
    let allFields = {};

    for (const result of successfulResponses) {

        const matches =
            extractMatchObjects(
                result.data
            );

        allMatches.push(...matches);

        const fields =
            findSemanticFields(
                result.data
            );

        for (const [key, value] of Object.entries(fields)) {

            if (
                value &&
                !allFields[key]
            ) {
                allFields[key] = value;
            }
        }
    }

    return {
        matches: allMatches,
        fields: allFields
    };
}

function renderFuture(analysis) {

        getFutureMatches(

                    <div class="result-name">

                    <div class="result-detail">

                    </div>
                </div>
                <span class="badge warn">DA VERIFICARE</span>
            </div>
        `;

        return;
    }

    const examples =
        future.slice(0, 5);

    let html = `
        <div class="result-row">
            <div>
                <div class="result-name">

                </div>

}

/* =========================================================
   ANALISI PRINCIPALE
   ========================================================= */

async function startAnalysis() {

    const apiKey =
        apiKeyInput.value.trim();

    if (!apiKey) {

        setStatus(
            "Inserisci la API Key.",
            "error"
        );

        return;
    }

    let baseUrl;

    try {

        baseUrl =
            normalizeUrl(
                apiUrlInput.value
            );

    } catch (error) {

        setStatus(
            error.message,
            "error"
        );

        return;
    }

    startBtn.disabled = true;
    clearBtn.disabled = true;

    requestCount = 0;
    endpointCount = 0;
    dataCount = 0;
    errorCount = 0;

    discoveredEndpoints = [];
    successfulResponses = [];

    updateCounters();

    report.classList.remove("hidden");

    generalResult.innerHTML = "";
    futureResult.innerHTML = "";
    featuresResult.innerHTML = "";
    structureResult.innerHTML = "";

    try {

        /* -------------------------------------------------
           FASE 1
           Prova ESATTAMENTE l'URL inserito.
           ------------------------------------------------- */

        setStatus(
            "1/4 — Controllo l'URL API inserito..."
        );

        addEndpoint(baseUrl);

        const direct =
            await requestApi(baseUrl);

        let openApiData = null;
        let operations = [];
        let operationResults = [];


        /* -------------------------------------------------
           FASE 2
           Cerca documentazione/schema.
           ------------------------------------------------- */

        setStatus(
            "2/4 — Cerco automaticamente la struttura dell'API..."
        );

        const docs =
            buildDocumentationUrls(
                baseUrl
            );

        for (const docUrl of docs) {

            if (requestCount >= MAX_REQUESTS) {
                break;
            }

            addEndpoint(docUrl);

            const result =
                await requestApi(docUrl);

            if (
                result.ok &&
                isOpenApi(result.data)
            ) {

                openApiData =
                    result.data;

                operations =
                    findRelevantOperations(
                        openApiData
                    );

                break;
            }
        }


        /* -------------------------------------------------
           FASE 3
           Se esiste OpenAPI, usa la struttura reale.
           ------------------------------------------------- */

        if (openApiData) {

            setStatus(
                "3/4 — Struttura trovata. Interrogo gli endpoint reali..."
            );

            operationResults =
                await probeOperations(
                    baseUrl,
                    operations,
                    7
                );

        } else {

            /* ---------------------------------------------
               Nessun OpenAPI:
               prova pochi endpoint comuni.
               --------------------------------------------- */

            setStatus(
                "3/4 — Nessuno schema automatico trovato. Provo percorsi comuni..."
            );

            const fallback =
                buildFallbackEndpoints(
                    baseUrl
                );

            for (const target of fallback) {

                if (
                    requestCount >= MAX_REQUESTS
                ) {
                    break;
                }

                addEndpoint(target);

                const response =
                    await requestApi(target);

                if (response.ok) {

                    const matches =
                        extractMatchObjects(
                            response.data
                        );

                    const fields =
                        findSemanticFields(
                            response.data
                        );

                    const objectCount =
                        flattenObjects(
                            response.data
                        ).length;

                    dataCount += objectCount;

                    updateCounters();

                    operationResults.push({
                        target,
                        response,
                        matches,
                        fields,
                        objectCount
                    });

                    /*
                     * Se abbiamo già trovato una risposta
                     * chiaramente calcistica, non continuiamo
                     * inutilmente a consumare richieste.
                     */

                    if (
                        matches.length > 0 ||
                        fields.partita ||
                        fields.casa ||
                        fields.ospite
                    ) {
                        break;
                    }
                }
            }
        }


        /* -------------------------------------------------
           FASE 4
           Analisi finale.
           ------------------------------------------------- */

        setStatus(
            "4/4 — Analizzo i dati ottenuti..."
        );

        const analysis =
            analyzeResponses();


        /*
         * Aggiunge anche i risultati delle probe
         * che non erano presenti in successfulResponses
         * per sicurezza.
         */

        for (const result of operationResults) {

            if (
                result.response &&
                result.response.ok
            ) {

                const matches =
                    result.matches ||
                    extractMatchObjects(
                        result.response.data
                    );

                analysis.matches.push(
                    ...matches
                );
            }
        }


        /*
         * Rimuove duplicati approssimativi.
         */

        analysis.matches =
            [...new Set(
                analysis.matches.map(
                    item => JSON.stringify(item)
                )
            )].map(
                item => JSON.parse(item)
            );


        /*
         * Se non abbiamo trovato partite ma
         * una risposta diretta esiste, analizziamo
         * comunque i suoi campi.
         */

        if (
            direct.ok &&
            isObject(direct.data)
        ) {

            const directFields =
                findSemanticFields(
                    direct.data
                );

            for (
                const [key, value]
                of Object.entries(directFields)
            ) {

                if (
                    value &&
                    !analysis.fields[key]
                ) {
                    analysis.fields[key] =
                        value;
                }
            }
        }


        renderGeneral(
            baseUrl,
            analysis
        );

        renderFuture(
            analysis
        );

        renderFeatures(
            analysis
        );

        renderStructure(
            openApiData,
            operations
        );


        const future =
            getFutureMatches(
                analysis.matches
            );


        if (
            successfulResponses.length > 0
        ) {

            if (future.length > 0) {

                setStatus(
                    "Analisi completata: l'API ha restituito partite future verificabili.",
                    "ok"
                );

            } else {

                setStatus(
                    "Analisi completata. L'API risponde, ma non è stata verificata una partita nei prossimi 7 giorni.",
                    ""
                );
            }

        } else {

            setStatus(
                "Analisi terminata: non è stato possibile ottenere una risposta valida dall'API.",
                "error"
            );
        }

    } catch (error) {

        errorCount++;

        updateCounters();

        setStatus(
            "Errore durante l'analisi: " +
            error.message,
            "error"
        );

    } finally {

        startBtn.disabled = false;
        clearBtn.disabled = false;

        updateCounters();
    }
}


/* =========================================================
   CANCELLA
   ========================================================= */

function clearAll() {

    apiUrlInput.value = "";
    apiKeyInput.value = "";

    requestCount = 0;
    endpointCount = 0;
    dataCount = 0;
    errorCount = 0;

    discoveredEndpoints = [];
    successfulResponses = [];

    updateCounters();

    report.classList.add("hidden");

    generalResult.innerHTML = "";
    futureResult.innerHTML = "";
    featuresResult.innerHTML = "";
    structureResult.innerHTML = "";

    setStatus(
        "Pronto per il test."
    );
}


/* =========================================================
   EVENTI
   ========================================================= */

startBtn.addEventListener(
    "click",
    startAnalysis
);

clearBtn.addEventListener(
    "click",

);

apiUrlInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {
            startAnalysis();
        }
    }
);

apiKeyInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {
            startAnalysis();
        }
    }
);

</script>
